<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APEX - Faster Together!</title>
  <meta name="description"
    content="Client-only static web application serving as a structured sim racing coach for Forza Motorsport 2023 with Moza R3 wheel based on Going Faster!">

  <!-- Google Fonts: Rajdhani (Headings/Brand), Space Grotesk (Body/UI), JetBrains Mono (Telemetry), Titillium Web (Gear/Speed) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Titillium+Web:ital,wght@0,600;0,700;1,600;1,700;1,900&display=swap"
    rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/components.css">
</head>

<body>

  <!-- Mobile Top Header (Mobile < 768px) -->
  <header class="mobile-top-header" role="banner">
    <div class="mobile-header-brand" id="mobileHeaderBrand">
      <span class="mobile-logo-icon"><i data-lucide="gauge"></i></span>
      <span class="mobile-logo-title">APEX</span>
    </div>
    <div class="mobile-header-title-wrapper">
      <span class="mobile-header-title" id="mobileHeaderTitle">Dashboard</span>
    </div>
    <div class="mobile-header-actions">
      <button class="mobile-header-btn" id="mobileQuickActionsBtn" aria-label="Quick Actions & Tools">
        <i data-lucide="sliders-horizontal"></i>
      </button>
    </div>
  </header>

  <div class="app-wrapper">
    <!-- Desktop Sidebar Navigation -->
    <aside class="sidebar" role="navigation" aria-label="Main Navigation">
      <div>
        <div class="sidebar-header">
          <div class="logo-brand">
            <span class="logo-icon"><i data-lucide="gauge"></i></span>
            <div class="logo-text-wrapper">
              <span class="logo-title">APEX</span>
              <span class="logo-tagline">Faster Together!</span>
            </div>
          </div>
        </div>

        <nav class="sidebar-nav">
          <a href="#" class="nav-link active" data-page="dashboard">
            <span class="icon"><i data-lucide="layout-dashboard"></i></span>
            <span class="nav-label">Home</span>
          </a>
          <a href="#" class="nav-link" data-page="modules">
            <span class="icon"><i data-lucide="layers"></i></span>
            <span class="nav-label">Modules</span>
          </a>
          <a href="#" class="nav-link" data-page="guide">
            <span class="icon"><i data-lucide="compass"></i></span>
            <span class="nav-label">Coach</span>
          </a>
          <a href="#" class="nav-link" data-page="progress">
            <span class="icon"><i data-lucide="line-chart"></i></span>
            <span class="nav-label">Progress</span>
          </a>
          <a href="#" class="nav-link" data-page="journal">
            <span class="icon"><i data-lucide="notebook-pen"></i></span>
            <span class="nav-label">Notes</span>
          </a>
          <a href="#" class="nav-link" data-page="psychology">
            <span class="icon"><i data-lucide="brain"></i></span>
            <span class="nav-label">Mindset</span>
          </a>
          <a href="#" class="nav-link" data-page="reference">
            <span class="icon"><i data-lucide="book-open"></i></span>
            <span class="nav-label">Reference</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-footer">
        <a href="#" class="nav-link" data-page="export">
          <span class="icon"><i data-lucide="download"></i></span>
          <span class="nav-label">Export Backup</span>
        </a>
        <a href="#" class="nav-link" data-page="import">
          <span class="icon"><i data-lucide="upload"></i></span>
          <span class="nav-label">Import Progress</span>
        </a>

        <button class="sidebar-toggle-btn mt-2" id="sidebarToggleBtn" aria-label="Toggle Sidebar"
          title="Toggle Sidebar">
          <span class="icon"><i data-lucide="chevrons-left"></i></span>
          <span class="nav-label">Collapse Sidebar</span>
        </button>

        <div class="sidebar-footer-info mt-2">
          <span>v1.0.0 • Client-Only</span>
        </div>
      </div>
    </aside>

    <!-- Main Content Container -->
    <main class="main-content" id="mainContent">

      <!-- Dashboard View -->
      <div class="page-view active" id="dashboard">
        <!-- Rendered dynamically by dashboardController -->
      </div>

      <!-- Modules & Sessions View -->
      <div class="page-view" id="modules" style="display:none;">
        <!-- Rendered dynamically by modulesController -->
      </div>

      <!-- Session View -->
      <div class="page-view" id="session" style="display:none;">
        <div class="page-container">
          <div id="sessionHeaderContainer"></div>
          <div id="sessionStepContainer"></div>
        </div>
      </div>

      <!-- Progress Analytics View -->
      <div class="page-view" id="progress" style="display:none;">
        <!-- Rendered dynamically by progressController -->
      </div>

      <!-- Driver Journal View -->
      <div class="page-view" id="journal" style="display:none;">
        <!-- Rendered dynamically by journalController -->
      </div>

      <!-- Reference Library View -->
      <div class="page-view" id="reference" style="display:none;">
        <!-- Rendered dynamically by referenceController -->
      </div>

      <!-- Motor Psychology View -->
      <div class="page-view" id="psychology" style="display:none;">
        <!-- Rendered dynamically by psychologyController -->
      </div>

      <!-- Driver & Equipment Guide View -->
      <div class="page-view" id="guide" style="display:none;">
        <!-- Rendered dynamically by guideController -->
      </div>

      <!-- Export/Import Views -->
      <div class="page-view" id="export" style="display:none;">
        <!-- Rendered dynamically by exportController -->
      </div>
      <div class="page-view" id="import" style="display:none;">
        <!-- Rendered dynamically by exportController -->
      </div>

    </main>
  </div>

  <!-- Mobile Bottom Navigation (Mobile < 768px) -->
  <nav class="mobile-bottom-nav" role="navigation" aria-label="Mobile Navigation">
    <button class="mobile-nav-item active" data-page="dashboard">
      <span class="icon"><i data-lucide="layout-dashboard"></i></span>
      <span>Home</span>
    </button>
    <button class="mobile-nav-item" data-page="modules">
      <span class="icon"><i data-lucide="layers"></i></span>
      <span>Modules</span>
    </button>
    <button class="mobile-nav-item" data-page="progress">
      <span class="icon"><i data-lucide="line-chart"></i></span>
      <span>Progress</span>
    </button>
    <button class="mobile-nav-item" data-page="journal">
      <span class="icon"><i data-lucide="notebook-pen"></i></span>
      <span>Journal</span>
    </button>
    <button class="mobile-nav-item" data-page="psychology">
      <span class="icon"><i data-lucide="brain"></i></span>
      <span>Psychology</span>
    </button>
    <button class="mobile-nav-item" id="mobileMoreBtn" aria-label="Open More Menu">
      <span class="icon"><i data-lucide="more-horizontal"></i></span>
      <span>More</span>
    </button>
  </nav>

  <!-- Mobile More / Quick Actions Bottom Sheet -->
  <div class="mobile-sheet-overlay" id="mobileMoreOverlay" style="display:none;">
    <div class="mobile-bottom-sheet" id="mobileMoreSheet">
      <div class="sheet-handle-bar"></div>
      <div class="sheet-header">
        <div class="sheet-title">
          <i data-lucide="layers" class="icon-sm icon-accent"></i>
          <span>Navigation & Tools</span>
        </div>
        <button class="sheet-close-btn" id="mobileSheetCloseBtn" aria-label="Close menu">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="sheet-body">
        <div class="sheet-menu-group">
          <div class="sheet-menu-label">Additional Views</div>
          <button class="sheet-menu-item" data-page="guide">
            <span class="icon"><i data-lucide="compass"></i></span>
            <span>Driver & Equipment Guide</span>
          </button>
          <button class="sheet-menu-item" data-page="reference">
            <span class="icon"><i data-lucide="book-open"></i></span>
            <span>Reference Library</span>
          </button>
        </div>

        <div class="sheet-menu-group">
          <div class="sheet-menu-label">Data & Backup</div>
          <button class="sheet-menu-item" data-action="export">
            <span class="icon"><i data-lucide="download"></i></span>
            <span>Export Backup</span>
          </button>
          <button class="sheet-menu-item" data-action="import">
            <span class="icon"><i data-lucide="upload"></i></span>
            <span>Import Progress</span>
          </button>
        </div>

        <div class="sheet-menu-group">
          <div class="sheet-menu-label">Setup & Settings</div>
          <button class="sheet-menu-item" data-action="equipment">
            <span class="icon"><i data-lucide="gamepad-2"></i></span>
            <span>Equipment Setup</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Global Modal Overlay -->
  <div class="modal-overlay" id="globalModalOverlay">
    <div class="modal-container" id="globalModalContainer"></div>
  </div>

  <!-- JavaScript Modules -->
  <script src="js/state.js"></script>
  <script src="js/content.js"></script>
  <script src="js/diagrams.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/session.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/modules.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/journal.js"></script>
  <script src="js/reference.js"></script>
  <script src="js/psychology.js"></script>
  <script src="js/guide.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
